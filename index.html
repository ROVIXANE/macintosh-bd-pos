<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1f38" />
    <meta name="description" content="Macintosh BD point of sale and inventory management system" />
    <title>Macintosh BD — POS</title>
    <script>
      // Restore the route captured by GitHub Pages' 404.html fallback.
      (function () {
        var target = sessionStorage.getItem('macintosh-spa-redirect');
        if (target) {
          sessionStorage.removeItem('macintosh-spa-redirect');
          window.history.replaceState(null, '', '/macintosh-bd-pos' + target);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
